version: 2

project_name: git-comb

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: contrib/completion/*
        dst: completions

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    include:
      - "^(build|feat|fix|docs|test|ci|chore|perf|refactor):"
